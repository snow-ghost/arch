name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python3 -m compileall -q evals tests
      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate evaluation dry run
        run: python3 evals/run_eval.py --dry-run --output-dir /tmp/arch-eval-dry-run
